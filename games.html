<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>2D Character Game</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        background: #87ceeb;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }

    .controls {
        position: fixed;

        top: 20px;
        left: 20px;

        background: rgba(0, 0, 0, 0.65);

        color: white;

        padding: 14px 18px;

        border-radius: 10px;

        font-family: Arial, sans-serif;

        line-height: 1.6;

        user-select: none;
    }

</style>

</head>

<body>

<div class="controls">

    A / D or ← / → : Walk<br>
    Shift + Move : Run<br>
    Space : Jump

</div>

<canvas id="game"></canvas>


<script>

// ======================================================
// CANVAS
// ======================================================

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

function resizeCanvas() {

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


// ======================================================
// KEYBOARD
// ======================================================

const keys = {};

window.addEventListener(
    "keydown",
    (event) => {

        keys[event.code] = true;

        if (
            event.code === "Space" ||
            event.code === "ArrowLeft" ||
            event.code === "ArrowRight"
        ) {

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    (event) => {

        keys[event.code] = false;

    }
);


// ======================================================
// PLAYER IMAGE PATH
// ======================================================

const PLAYER_PATH =
    "./assets/player/";


// ======================================================
// ANIMATIONS
// ======================================================

const animationSources = {

    idle: [

        "idle_1.png",
        "idle_2.png",
        "idle_3.png",
        "idle_4.png"

    ],

    walk: [

        "walk_1.png",
        "walk_2.png",
        "walk_3.png",
        "walk_4.png",
        "walk_5.png",
        "walk_6.png"

    ],

    run: [

        "run_1.png",
        "run_2.png",
        "run_3.png",
        "run_4.png",
        "run_5.png",
        "run_6.png"

    ],

    jump: [

        "jump_1.png",
        "jump_2.png",
        "jump_3.png",
        "jump_4.png",
        "jump_5.png"

    ]

};


// ======================================================
// ANIMATION SPEED
// ======================================================

// milliseconds per frame

const animationSpeed = {

    idle: 200,

    walk: 110,

    run: 75,

    jump: 120

};


// ======================================================
// LOAD ALL IMAGES
// ======================================================

const animations = {};

let totalImages = 0;

let loadedImages = 0;

let gameReady = false;


for (const animationName in animationSources) {

    animations[animationName] = [];

    animationSources[animationName].forEach(

        filename => {

            totalImages++;

            const image = new Image();

            image.src =
                PLAYER_PATH + filename;

            image.onload = () => {

                loadedImages++;

                console.log(
                    "Loaded:",
                    filename
                );

                if (
                    loadedImages ===
                    totalImages
                ) {

                    gameReady = true;

                    console.log(
                        "All character frames loaded."
                    );

                }

            };


            image.onerror = () => {

                console.error(
                    "Could not load:",
                    image.src
                );

            };


            animations[
                animationName
            ].push(image);

        }

    );

}


// ======================================================
// PLAYER
// ======================================================

const player = {

    x: 400,

    y: 300,

    width: 220,

    height: 220,

    velocityX: 0,

    velocityY: 0,

    walkSpeed: 4,

    runSpeed: 8,

    acceleration: 0.65,

    friction: 0.82,

    gravity: 0.75,

    jumpPower: 16,

    grounded: false,

    facing: 1,

    currentAnimation: "idle",

    currentFrame: 0,

    frameTimer: 0,

    jumpStarted: false

};


// ======================================================
// GROUND
// ======================================================

function groundY() {

    return canvas.height * 0.82;

}


// ======================================================
// CHANGE ANIMATION
// ======================================================

function setAnimation(name) {

    if (
        player.currentAnimation === name
    ) {

        return;

    }

    player.currentAnimation = name;

    player.currentFrame = 0;

    player.frameTimer = 0;

}


// ======================================================
// PLAYER MOVEMENT
// ======================================================

function updatePlayer() {

    const left =

        keys["KeyA"] ||
        keys["ArrowLeft"];


    const right =

        keys["KeyD"] ||
        keys["ArrowRight"];


    const running =

        keys["ShiftLeft"] ||
        keys["ShiftRight"];


    // ==================================================
    // MOVE LEFT
    // ==================================================

    if (left) {

        const maxSpeed =
            running
                ? player.runSpeed
                : player.walkSpeed;


        player.velocityX -=
            player.acceleration;


        if (
            player.velocityX <
            -maxSpeed
        ) {

            player.velocityX =
                -maxSpeed;

        }


        player.facing = -1;

    }


    // ==================================================
    // MOVE RIGHT
    // ==================================================

    else if (right) {

        const maxSpeed =
            running
                ? player.runSpeed
                : player.walkSpeed;


        player.velocityX +=
            player.acceleration;


        if (
            player.velocityX >
            maxSpeed
        ) {

            player.velocityX =
                maxSpeed;

        }


        player.facing = 1;

    }


    // ==================================================
    // STOP
    // ==================================================

    else {

        player.velocityX *=
            player.friction;


        if (
            Math.abs(
                player.velocityX
            ) < 0.05
        ) {

            player.velocityX = 0;

        }

    }


    // ==================================================
    // JUMP
    // ==================================================

    if (
        keys["Space"] &&
        player.grounded &&
        !player.jumpStarted
    ) {

        player.velocityY =
            -player.jumpPower;

        player.grounded = false;

        player.jumpStarted = true;

        setAnimation("jump");

    }


    // Allow another jump after Space released

    if (!keys["Space"]) {

        player.jumpStarted = false;

    }


    // ==================================================
    // GRAVITY
    // ==================================================

    player.velocityY +=
        player.gravity;


    // ==================================================
    // POSITION
    // ==================================================

    player.x +=
        player.velocityX;

    player.y +=
        player.velocityY;


    // ==================================================
    // GROUND COLLISION
    // ==================================================

    const ground = groundY();


    if (
        player.y +
        player.height / 2 >=
        ground
    ) {

        player.y =
            ground -
            player.height / 2;

        player.velocityY = 0;

        player.grounded = true;

    }


    // ==================================================
    // LEFT SIDE
    // ==================================================

    if (
        player.x -
        player.width / 2 <
        0
    ) {

        player.x =
            player.width / 2;

        player.velocityX = 0;

    }


    // ==================================================
    // RIGHT SIDE
    // ==================================================

    if (
        player.x +
        player.width / 2 >
        canvas.width
    ) {

        player.x =
            canvas.width -
            player.width / 2;

        player.velocityX = 0;

    }


    // ==================================================
    // CHOOSE ANIMATION
    // ==================================================

    if (!player.grounded) {

        setAnimation("jump");

    }

    else if (
        running &&
        Math.abs(
            player.velocityX
        ) > 0.5
    ) {

        setAnimation("run");

    }

    else if (
        Math.abs(
            player.velocityX
        ) > 0.5
    ) {

        setAnimation("walk");

    }

    else {

        setAnimation("idle");

    }

}


// ======================================================
// UPDATE ANIMATION
// ======================================================

function updateAnimation(deltaTime) {

    const name =
        player.currentAnimation;


    const frames =
        animations[name];


    if (
        !frames ||
        frames.length === 0
    ) {

        return;

    }


    player.frameTimer +=
        deltaTime;


    if (
        player.frameTimer >=
        animationSpeed[name]
    ) {

        player.frameTimer = 0;


        // ==================================================
        // JUMP ANIMATION
        // ==================================================

        if (name === "jump") {

            if (
                player.currentFrame <
                frames.length - 1
            ) {

                player.currentFrame++;

            }

        }


        // ==================================================
        // LOOP IDLE / WALK / RUN
        // ==================================================

        else {

            player.currentFrame++;

            if (
                player.currentFrame >=
                frames.length
            ) {

                player.currentFrame = 0;

            }

        }

    }

}


// ======================================================
// DRAW BACKGROUND
// ======================================================

function drawBackground() {

    // Sky

    const skyGradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    skyGradient.addColorStop(
        0,
        "#75c7ff"
    );


    skyGradient.addColorStop(
        0.7,
        "#dff4ff"
    );


    ctx.fillStyle =
        skyGradient;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Ground

    const ground =
        groundY();


    ctx.fillStyle =
        "#70b957";


    ctx.fillRect(
        0,
        ground,
        canvas.width,
        canvas.height - ground
    );


    // Ground top

    ctx.fillStyle =
        "#8bd167";


    ctx.fillRect(
        0,
        ground,
        canvas.width,
        12
    );

}


// ======================================================
// DRAW PLAYER SHADOW
// ======================================================

function drawShadow() {

    ctx.save();


    ctx.beginPath();


    ctx.ellipse(

        player.x,

        groundY() + 4,

        player.width * 0.28,

        13,

        0,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(0,0,0,0.2)";


    ctx.fill();


    ctx.restore();

}


// ======================================================
// DRAW PLAYER
// ======================================================

function drawPlayer() {

    const animation =
        animations[
            player.currentAnimation
        ];


    const image =
        animation[
            player.currentFrame
        ];


    if (
        !image ||
        !image.complete
    ) {

        return;

    }


    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    // ==================================================
    // FACE LEFT / RIGHT
    // ==================================================

    ctx.scale(
        player.facing,
        1
    );


    // ==================================================
    // DRAW CHARACTER
    // ==================================================

    ctx.drawImage(

        image,

        -player.width / 2,

        -player.height / 2,

        player.width,

        player.height

    );


    ctx.restore();

}


// ======================================================
// LOADING SCREEN
// ======================================================

function drawLoadingScreen() {

    ctx.fillStyle =
        "#171923";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "white";


    ctx.font =
        "30px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(

        "Loading character...",

        canvas.width / 2,

        canvas.height / 2

    );


    ctx.font =
        "18px Arial";


    ctx.fillText(

        loadedImages +
        " / " +
        totalImages,

        canvas.width / 2,

        canvas.height / 2 + 40

    );

}


// ======================================================
// GAME LOOP
// ======================================================

let lastTime =
    performance.now();


function gameLoop(time) {

    const deltaTime =
        time - lastTime;


    lastTime = time;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ==================================================
    // WAIT UNTIL IMAGES LOADED
    // ==================================================

    if (!gameReady) {

        drawLoadingScreen();

        requestAnimationFrame(
            gameLoop
        );

        return;

    }


    // ==================================================
    // UPDATE
    // ==================================================

    updatePlayer();

    updateAnimation(
        deltaTime
    );


    // ==================================================
    // DRAW
    // ==================================================

    drawBackground();

    drawShadow();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


// ======================================================
// START PLAYER
// ======================================================

player.x =
    canvas.width / 2;


player.y =
    groundY() -
    player.height / 2;


requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
